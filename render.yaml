services:
  - type: web
    name: time-control-api
    runtime: go
    plan: free
    buildCommand: go build -ldflags="-s -w" -o api ./cmd/api
    startCommand: ./api
    envVars:
      - key: GO_VERSION
        value: 1.25.0
      - key: DATABASE_URL_POOLER
        sync: false
      - key: JWT_SECRET
        sync: false
    healthCheckPath: /health
